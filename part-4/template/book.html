<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Books Dashboard</title>
<style>
    /* ====== GLOBAL STYLES ====== */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        color: #fff;
        min-height: 100vh;
        padding: 20px;
    }

    /* ====== NAVBAR ====== */
    nav {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
        padding: 15px 30px;
        background: rgba(0,0,0,0.4);
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    nav a {
        color: #0ab5f3;
        text-decoration:none;
        font-weight: 600;
        transition: 0.3s;
    }

    nav a:hover {
        color: #f9d423;
        text-shadow: 0 0 8px rgba(249,212,35,0.7);
    }

    /* ====== SEARCH BOX ====== */
    .search-box {
        margin-bottom: 30px;
        text-align: center;
    }

    .search-box input {
        width: 60%;
        padding: 12px 18px;
        border-radius: 30px;
        border: none;
        outline: none;
        font-size: 16px;
        background: rgba(255,255,255,0.1);
        color: #fff;
        transition: all 0.3s;
        box-shadow: inset 0 0 10px rgba(255,255,255,0.2);
    }

    .search-box input::placeholder {
        color: #ccc;
    }

    .search-box input:focus {
        background: rgba(255,255,255,0.2);
        box-shadow: inset 0 0 15px rgba(255,255,255,0.3);
    }

    /* ====== FORM CARDS ====== */
    .form-card {
        background: rgba(255,255,255,0.05);
        padding: 20px;
        margin-bottom: 10px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.7);
        backdrop-filter: blur(8px);
        transition: transform 0.3s, box-shadow 0.3s;
    }

    .form-card:hover {
        transform: translateY(-5px) rotateX(3deg);
        box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }

    .form-card h2 {
        margin-bottom: 15px;
        color: #7ee893;
        text-shadow: 0 0 8px rgba(132, 239, 99, 0.7);
    }

    input, button {
        padding: 10px;
        margin: 5px 0;
        border-radius: 8px;
        border: none;
        font-size: 14px;
    }

    button {
        cursor: pointer;
        background: #e00bd2;
        color: #0b17ff;
        font-weight: bold;
        transition: all 0.3s;
    }

    button:hover {
        background: #f9d423;
        color: #000;
        box-shadow: 0 0 10px rgba(249,212,35,0.7);
    }

    /* ====== BOOK CARDS GRID ====== */
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 25px;
    }

    .book-card {
        background: rgba(255,255,255,0.05);
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.7);
        transition: transform 0.3s, box-shadow 0.3s;
        backdrop-filter: blur(8px);
    }

    .book-card:hover {
        transform: translateY(-10px) rotateX(5deg);
        box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }

    .book-card h3 {
        margin-bottom: 12px;
        color: #aef21c;
        text-shadow: 0 0 6px rgba(180, 5, 113, 0.8);
    }

    .book-card p {
        font-size: 14px;
        margin-bottom: 8px;
        line-height: 1.5;
        color: #fff;
    }

    .book-card span {
        font-weight: bold;
        color: #41f29f;
    }

    #editBookCard { display: none; }

    @media(max-width:600px){
        .search-box input {
            width: 90%;
        }
    }
</style>
</head>

<body onload="loadBooks()">

<!-- SEARCH -->
<div class="search-box">
    <input type="text" id="searchInput" placeholder="Search books..." onkeyup="filterBooks()">
</div>

<!-- NAVBAR -->
<nav>
    <a href="index.html">Dashboard</a>
    <a href="book.html">Books</a>
    <a href="author.html">Authors</a>
</nav>

<!-- ADD BOOK FORM -->
<div class="form-card">
    <h2>➕ Add Book</h2>
    <form id="bookForm">
        <input type="text" id="title" placeholder="Title" required>
        <input type="number" id="author_id" placeholder="Author ID" required>
        <input type="number" id="year" placeholder="Year">
        <input type="text" id="isbn" placeholder="ISBN">
        <br>
        <button type="submit">Add Book</button>
    </form>
</div>

<!-- EDIT BOOK FORM -->
<div class="form-card" id="editBookCard">
    <h2>✏️ Edit Book</h2>
    <form id="editBookForm">
        <input type="hidden" id="edit_id">
        <input type="text" id="edit_title" placeholder="Title" required>
        <input type="number" id="edit_author_id" placeholder="Author ID" required>
        <input type="number" id="edit_year" placeholder="Year">
        <input type="text" id="edit_isbn" placeholder="ISBN">
        <br>
        <button type="submit">Update</button>
        <button type="button" onclick="closeEdit()">Cancel</button>
    </form>
</div>

<!-- BOOKS LIST -->
<h2 style="margin-bottom:15px; color:#f9d423; text-shadow:0 0 6px rgba(249,212,35,0.8);">📚 Books List</h2>
<div class="grid" id="bookList"></div>

<script>
const API = "http://127.0.0.1:5000/api/books";

/* LOAD BOOKS */
function loadBooks() {
    fetch(API)
        .then(res => res.json())
        .then(data => {
            const list = document.getElementById("bookList");
            list.innerHTML = "";
            data.books.forEach(book => {
                list.innerHTML += `
                    <div class="book-card">
                        <h3>${book.title}</h3>
                        <p><span>Year:</span> ${book.year || "N/A"}</p>
                        <p><span>Author ID:</span> ${book.author ? book.author.id : "Unknown"}</p>
                        <p><span>ISBN:</span> ${book.isbn || "N/A"}</p>
                        <button onclick="openEditBook(${book.id}, '${book.title}', ${book.author ? book.author.id : 0}, ${book.year || 0}, '${book.isbn || ""}')">✏️ Edit</button>
                        <button onclick="deleteBook(${book.id})">🗑 Delete</button>
                    </div>
                `;
            });
        })
        .catch(err => console.error(err));
}

/* ADD BOOK */
document.getElementById("bookForm").addEventListener("submit", function(e){
    e.preventDefault();
    const book = {
        title: title.value,
        author_id: author_id.value,
        year: year.value,
        isbn: isbn.value
    };
    fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(book)
    }).then(() => {
        this.reset();
        loadBooks();
    });
});

/* DELETE BOOK */
function deleteBook(id){
    fetch(`${API}/${id}`, { method: "DELETE" }).then(()=> loadBooks());
}

/* OPEN EDIT BOOK */
function openEditBook(id, titleVal, authorId, yearVal, isbnVal){
    document.getElementById("editBookCard").style.display = "block";
    edit_id.value = id;
    edit_title.value = titleVal;
    edit_author_id.value = authorId;
    edit_year.value = yearVal;
    edit_isbn.value = isbnVal;
}

/* CLOSE EDIT */
function closeEdit(){
    document.getElementById("editBookCard").style.display = "none";
}

/* UPDATE BOOK */
document.getElementById("editBookForm").addEventListener("submit", function(e){
    e.preventDefault();
    const id = edit_id.value;
    const updatedBook = {
        title: edit_title.value,
        author_id: edit_author_id.value,
        year: edit_year.value,
        isbn: edit_isbn.value
    };
    fetch(`${API}/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(updatedBook)
    }).then(() => {
        closeEdit();
        loadBooks();
    });
});

/* SEARCH BOOKS */
function filterBooks(){
    const val = searchInput.value.toLowerCase();
    const cards = document.querySelectorAll(".book-card");
    cards.forEach(card => {
        card.style.display = card.textContent.toLowerCase().includes(val) ? "block" : "none";
    });
}
</script>

</body>
</html>

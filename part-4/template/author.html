<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Authors Dashboard</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: #ffffff;
    min-height: 100vh;
    padding: 20px;
}

nav {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
    padding: 15px 30px;
    background: rgba(0,0,0,0.4);
    border-radius: 12px;
}

nav a {
    color: #0ab5f3;
    text-decoration:none;
    font-weight: 600;
}

.search-box {
    margin-bottom: 30px;
    text-align: center;
}

.search-box input {
    width: 60%;
    padding: 12px 18px;
    border-radius: 30px;
    border: none;
    outline: none;
    background: rgba(255,255,255,0.1);
    color: #fff;
}

.form-card {
    background: rgba(255,255,255,0.05);
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 15px;
}

.form-card:hover {
        transform: translateY(-5px) rotateX(3deg);
        box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }

    .form-card h2 {
        margin-bottom: 15px;
        color: #7ee893;
        text-shadow: 0 0 8px rgba(132, 239, 99, 0.7);
    }


input, button {
    padding: 10px;
    margin: 6px 0;
    border-radius: 8px;
    border: none;
}

button {
    background: #e00bd2;
    color: #0b17ff;
    font-weight: bold;
    cursor: pointer;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 25px;
}

.author-card {
    background: rgba(255,255,255,0.05);
    padding: 20px;
    border-radius: 15px;
}

.author-card h3 {
    color: #aef21c;
}

.author-card span {
    color: #15e442;
    font-weight: bold;
}

#editAuthorCard { display: none; }
</style>
</head>

<body onload="loadAuthors()">

<div class="search-box">
    <input type="text" id="searchInput" placeholder="Search authors..." onkeyup="filterAuthors()">
</div>

<nav>
    <a href="index.html">Dashboard</a>
    <a href="book.html">Books</a>
    <a href="author.html">Authors</a>
</nav>

<div class="form-card">
    <h2>➕ Add Author</h2>
    <form id="authorForm">
        <input type="text" id="name" placeholder="Author Name" required>
        <input type="text" id="bio" placeholder="Bio">
        <input type="text" id="city" placeholder="City">
        <br>
        <button type="submit">Add Author</button>
    </form>
</div>

<div class="form-card" id="editAuthorCard">
    <h2>✏️ Edit Author</h2>
    <form id="editForm">
        <input type="hidden" id="edit_id">
        <input type="text" id="edit_name" required>
        <input type="text" id="edit_bio">
        <input type="text" id="edit_city">
        <br>
        <button type="submit">Update</button>
        <button type="button" onclick="closeEdit()">Cancel</button>
    </form>
</div>

<h2 style="margin-bottom:15px;color:#f9d423;">👤 Authors List </h2>
<div class="grid" id="authorList"></div>

<script>
const API = "http://127.0.0.1:5000/api/authors";

/* LOAD AUTHORS */
function loadAuthors() {
    fetch(API)
        .then(res => res.json())
        .then(data => {
            const list = document.getElementById("authorList");
            list.innerHTML = "";

            data.authors.forEach(author => {
                list.innerHTML += `
                    <div class="author-card">
                        <h3>${author.name}</h3>
                        <p><span>Bio:</span> ${author.bio || "N/A"}</p>
                        <p><span>City:</span> ${author.city || "N/A"}</p>
                        <button onclick="openEdit(${author.id})">✏️ Edit</button>
                        <button onclick="deleteAuthor(${author.id})">🗑 Delete</button>
                    </div>
                `;
            });
        });
}

/* ADD AUTHOR — FIXED */
document.getElementById("authorForm").addEventListener("submit", function(e){
    e.preventDefault();

    fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            name: document.getElementById("name").value,
            bio: document.getElementById("bio").value,
            city: document.getElementById("city").value
        })
    })
    .then(res => {
        if (!res.ok) throw new Error("Bad Request");
        return res.json();
    })
    .then(() => {
        this.reset();
        loadAuthors();
    });
});

/* DELETE */
function deleteAuthor(id){
    fetch(`${API}/${id}`, { method: "DELETE" })
        .then(() => loadAuthors());
}

/* OPEN EDIT */
function openEdit(id){
    fetch(`${API}/${id}`)
        .then(res => res.json())
        .then(data => {
            editAuthorCard.style.display = "block";
            edit_id.value = data.author.id;
            edit_name.value = data.author.name;
            edit_bio.value = data.author.bio || "";
            edit_city.value = data.author.city || "";
        });
}

function closeEdit(){
    editAuthorCard.style.display = "none";
}

/* UPDATE */
document.getElementById("editForm").addEventListener("submit", function(e){
    e.preventDefault();
    const id = edit_id.value;

    fetch(`${API}/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            name: edit_name.value,
            bio: edit_bio.value,
            city: edit_city.value
        })
    }).then(() => {
        closeEdit();
        loadAuthors();
    });
});

/* SEARCH */
function filterAuthors(){
    const val = searchInput.value.toLowerCase();
    document.querySelectorAll(".author-card").forEach(card => {
        card.style.display = card.textContent.toLowerCase().includes(val)
            ? "block"
            : "none";
    });
}
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Edit Student - Part 3</title>
    <style>
/* ===== PAGE CENTERING ===== */
body {
    font-family: "Segoe UI", Arial, sans-serif;
    margin: 0;
    min-height: 100vh;

    /* center form */
    display: flex;
    justify-content: center;
    align-items: center;

    background: radial-gradient(circle at top, #1e293b, #020617);
    color: #e5e7eb;
}

/* ===== HEADING ===== */
h1 {
    position: absolute;
    top: 30px;
    color: #f8fafc;
    text-shadow: 0 4px 12px rgba(0,0,0,0.6);
}

/* ===== FORM CARD ===== */
form {
    background: linear-gradient(145deg, #111827, #1f2937);
    padding: 32px;
    border-radius: 18px;
    max-width: 420px;
    width: 100%;

    /* 3D + glass effect */
    box-shadow:
        0 25px 60px rgba(0,0,0,0.8),
        inset 0 1px 1px rgba(255,255,255,0.15);

    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);

    transform: perspective(1000px) translateZ(0);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

form:hover {
    transform: perspective(1000px) translateZ(12px);
    box-shadow:
        0 35px 80px rgba(0,0,0,0.9),
        inset 0 1px 1px rgba(255,255,255,0.2);
}

/* ===== INFO BOX ===== */
.info {
    background: linear-gradient(135deg, #0ea5e9, #0284c7);
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 22px;
    color: white;
    font-weight: 600;
    box-shadow: 0 8px 20px rgba(14,165,233,0.5);
}

/* ===== LABELS ===== */
label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
    color: #c7d2fe;
}

/* ===== INPUT & SELECT ===== */
input,
select {
    width: 100%;
    padding: 12px;
    margin-bottom: 20px;
    border-radius: 12px;
    box-sizing: border-box;

    background: #020617;
    border: 1px solid #334155;
    color: #f8fafc;

    box-shadow:
        inset 0 2px 6px rgba(0,0,0,0.6),
        0 1px 2px rgba(255,255,255,0.05);

    transition: border 0.3s ease, box-shadow 0.3s ease;
}

input:focus,
select:focus {
    outline: none;
    border-color: #8b5cf6;
    box-shadow:
        0 0 0 2px rgba(139,92,246,0.35),
        inset 0 2px 6px rgba(0,0,0,0.6);
}

/* ===== BUTTONS ===== */
.btn {
    padding: 13px 28px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    text-decoration: none;
    font-weight: 700;
    display: inline-block;

    box-shadow:
        0 10px 25px rgba(0,0,0,0.6),
        inset 0 1px 1px rgba(255,255,255,0.2);

    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.btn:hover {
    transform: translateY(-3px);
    box-shadow:
        0 18px 40px rgba(0,0,0,0.9),
        inset 0 1px 1px rgba(255,255,255,0.25);
}

/* ===== SUBMIT BUTTON ===== */
.btn-submit {
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: white;
}

/* ===== CANCEL BUTTON ===== */
.btn-cancel {
    background: linear-gradient(135deg, #9ca3af, #6b7280);
    color: #020617;
    margin-left: 10px;
}
</style>

</head>
<body>
    <h1>Edit Teacher</h1>

    <form method="POST">
        <div class="info">Editing: {{ teacher.name }} (ID: {{ teacher.id }})</div>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="{{ teacher.name }}" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" value="{{ teacher.email }}" required>

        <label for="course_id">Course:</label>
        <select id="course_id" name="course_id" required>
            {% for course in courses %}
                <option value="{{ course.id }}" {% if course.id == teacher.course_id %}selected{% endif %}>
                    {{ course.name }}
                </option>  <!-- Pre-select current course -->
            {% endfor %}
        </select>

        <button type="submit" class="btn btn-submit">Update teacher</button>
        <a href="{{ url_for('index') }}" class="btn btn-cancel">Cancel</a>
    </form>
</body>
</html>

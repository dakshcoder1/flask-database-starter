<!DOCTYPE html>
<html>
<head>
    <title>Add Teacher - Part 3</title>
    <style>
/* ===== PAGE CENTERING ===== */
body {
    font-family: "Segoe UI", Arial, sans-serif;
    margin: 0;
    min-height: 100vh;

    /* center form */
    display: flex;
    align-items: center;
    justify-content: center;

    /* premium background */
    background: radial-gradient(circle at top, #1e293b, #020617);
    color: #e5e7eb;
}

/* ===== HEADING ===== */
h1 {
    position: absolute;
    top: 40px;
    color: #f8fafc;
    text-shadow: 0 4px 12px rgba(0,0,0,0.6);
}

/* ===== FORM (3D CARD) ===== */
form {
    background: linear-gradient(145deg, #111827, #1f2937);
    padding: 35px;
    border-radius: 18px;
    max-width: 420px;
    width: 100%;

    /* 3D depth */
    box-shadow:
        0 25px 50px rgba(0,0,0,0.7),
        inset 0 1px 1px rgba(255,255,255,0.15);

    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);

    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

form:hover {
    transform: translateY(-6px) scale(1.01);
    box-shadow:
        0 35px 70px rgba(0,0,0,0.85),
        inset 0 1px 1px rgba(255,255,255,0.2);
}

/* ===== LABELS ===== */
label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
    color: #c7d2fe;
}

/* ===== INPUT & SELECT ===== */
input,
select {
    width: 100%;
    padding: 12px;
    margin-bottom: 20px;
    border-radius: 10px;
    box-sizing: border-box;

    background: #020617;
    border: 1px solid #334155;
    color: #f8fafc;

    box-shadow:
        inset 0 2px 6px rgba(0,0,0,0.6),
        0 1px 2px rgba(255,255,255,0.05);

    transition: border 0.3s ease, box-shadow 0.3s ease;
}

input:focus,
select:focus {
    outline: none;
    border-color: #22c55e;
    box-shadow:
        0 0 0 2px rgba(34,197,94,0.35),
        inset 0 2px 6px rgba(0,0,0,0.6);
}

/* ===== BUTTONS ===== */
.btn {
    padding: 12px 26px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    text-decoration: none;
    font-weight: 600;
    display: inline-block;

    box-shadow:
        0 10px 25px rgba(0,0,0,0.6),
        inset 0 1px 1px rgba(255,255,255,0.2);

    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.btn:hover {
    transform: translateY(-3px);
    box-shadow:
        0 16px 35px rgba(0,0,0,0.8),
        inset 0 1px 1px rgba(255,255,255,0.25);
}

/* ===== SUBMIT BUTTON ===== */
.btn-submit {
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: white;
}

/* ===== CANCEL BUTTON ===== */
.btn-cancel {
    background: linear-gradient(135deg, #9ca3af, #6b7280);
    color: #020617;
    margin-left: 10px;
}
</style>

</head>
<body><h1>Add New Teacher</h1>

    <form method="POST">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="course_id">Course this teacher will be teaching:</label>
        <select id="course_id" name="course_id" required>
            <option value="">-- Select Course --</option>
            {% for course in courses %}
                <option value="{{ course.id }}">{{ course.name }}</option>  <!-- Dropdown from database -->
            {% endfor %}
        </select>

        <button type="submit" class="btn btn-submit">Add Teacher</button>
        <a href="{{ url_for('index') }}" class="btn btn-cancel">Cancel</a>
    </form>

</body>
</html>

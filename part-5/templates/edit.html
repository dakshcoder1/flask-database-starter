<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product | Premium Inventory</title>
    <style>
        :root {
            --primary: #b39ddb; /* Soft Purple */
            --accent: #80cbc4; /* Teal */
            --bg-gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            margin: 0; 
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: #eceff1; 
            height: 100vh;
            display: flex; /* Flexbox for centering */
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 { 
            margin-bottom: 20px;
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            text-shadow: 0 10px 20px rgba(0,0,0,0.3);
            letter-spacing: -1px;
        }

        /* Centered Glassmorphism Form */
        form { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 40px; 
            border-radius: 24px; 
            width: 100%;
            max-width: 450px; 
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            transition: all 0.3s ease;
        }

        form:hover {
            border-color: rgba(179, 157, 219, 0.3);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8);
        }

        label { 
            display: block; 
            margin-bottom: 8px; 
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--primary); 
            letter-spacing: 0.5px;
        }

        input, textarea { 
            width: 100%; 
            padding: 12px 16px; 
            margin-bottom: 25px; 
            border: 1px solid var(--glass-border); 
            border-radius: 12px; 
            background: rgba(0, 0, 0, 0.2); 
            color: #fff; 
            font-size: 1rem;
            box-sizing: border-box; 
            transition: all 0.2s ease;
        }

        input:focus, textarea:focus { 
            border-color: var(--primary); 
            background: rgba(0, 0, 0, 0.4);
            outline: none; 
            box-shadow: 0 0 0 4px rgba(179, 157, 219, 0.2);
        }

        /* 3D Button Styling */
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .btn { 
            flex: 1;
            padding: 14px; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            text-decoration: none; 
            font-weight: 700;
            font-size: 1rem;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-block;
        }

        .btn-submit { 
            background: linear-gradient(135deg, #b39ddb, #7e57c2); 
            color: white; 
            box-shadow: 0 4px 15px rgba(126, 87, 194, 0.4);
        }

        .btn-cancel { 
            background: rgba(255, 255, 255, 0.1); 
            color: #cfd8dc; 
            border: 1px solid var(--glass-border);
        }

        .btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }

        .btn-submit:hover {
            box-shadow: 0 8px 25px rgba(126, 87, 194, 0.5);
        }

        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <h1>Edit Product</h1>

    <form method="POST">
        <label for="name">Product Name</label>
        <input type="text" id="name" name="name" value="{{ product.name }}" placeholder="Enter name..." required>

        <label for="price">Price ($)</label>
        <input type="number" id="price" name="price" step="0.01" min="0" value="{{ product.price }}" required>

        <label for="stock">Stock Quantity</label>
        <input type="number" id="stock" name="stock" min="0" value="{{ product.stock }}">

        <label for="description">Description</label>
        <textarea id="description" name="description" rows="3" placeholder="Optional details...">{{ product.description }}</textarea>

        <div class="button-group">
            <button type="submit" class="btn btn-submit">Update Product</button>
            <a href="{{ url_for('index') }}" class="btn btn-cancel">Cancel</a>
        </div>
    </form>

</body>
</html>

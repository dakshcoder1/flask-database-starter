<!DOCTYPE html>
<html>
<head>
    <title>Add Student - Part 2</title>
   
   
   <style>
/* =========================
   ADD PAGE
========================= */
body {
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #d9dbe0, #9c6af8);
    margin: 0;
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;   /* horizontal center */
    justify-content: center; /* vertical center */
}

form {
    max-width: 300px;
    background: rgb(70, 85, 212);
    padding: 82px;
    border-radius: 18px;
    box-shadow: 
        0 25px 50px rgba(0,0,0,0.15),
        inset 0 2px 6px rgba(255,255,255,0.7);
}

input {
    width: 100%;
    padding: 14px;
    margin-bottom: 18px;
    border-radius: 10px;
    border: 1px solid #bae6fd;
}

input:focus {
    outline: none;
    border-color: #0ea5e9;
}

/* Main submit button */
button {
    width: 100%;
    padding: 14px;
    border-radius: 30px;
    background: linear-gradient(135deg, #0ea5e9, #0284c7);
    color: white;
    border: none;
    font-weight: 800;
    box-shadow: 0 10px 25px rgba(230, 232, 235, 0.4);
    margin-bottom: 20px;   /* 🔹 GAP BELOW MAIN BUTTON */
}

/* Cancel button */
.btn-cancel {
    display: block;              /* 🔹 allows centering */
    width: fit-content;          /* 🔹 button size fits content */
    margin: 0 auto;              /* 🔹 CENTER THE BUTTON */
    padding: 14px 36px;
    font-size: 16px;
    border-radius: 32px;
    background: linear-gradient(135deg, #9ca3af, #6b7280);
    color: white;
    font-weight: 600;
    box-shadow: 0 8px 18px rgba(0,0,0,0.25);
}

/* Hover effect */
.btn-cancel:hover {
    background: linear-gradient(135deg, #6b7280, #4b5563);
    transform: translateY(-2px);
}


</style>

</head>
<body>
    <h1>Add New Student</h1>

    <form method="POST">  <!-- POST sends data to server -->
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required placeholder="Enter student nameo">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required placeholder="Enter email address">

        <label for="course">Course:</label>
        <input type="text" id="course" name="course" required placeholder="Enter course name">

        <button type="submit" class="btn btn-submit">Add Student</button>
        <a href="{{ url_for('index') }}" class="btn btn-submit btn-cancel">Cancel</a>

    </form>

    <hr>
    <p><strong>Tip:</strong> The "name" attribute in input fields must match request.form['name'] in Python!</p>
</body>
</html>

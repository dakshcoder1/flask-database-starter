<!DOCTYPE html>
<html>
<head>
    <title>Edit Student - Part 2</title>
    <style>
/* =========================
   EDIT PAGE (3D PREMIUM)
========================= */
body {
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #d9dbe0, #9c6af8);
    margin: 0;
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;   /* horizontal center */
    justify-content: center; /* vertical center */
}

form {
    max-width: 420px;
    background: linear-gradient(135deg, #0f6aea, #97e4f2);
    padding: 40px;
    border-radius: 20px;
    box-shadow:
        0 35px 70px rgba(0,0,0,0.8),
        inset 0 1px 3px rgba(255,255,255,0.1);
}

input {
    width: 100%;
    padding: 14px;
    margin-bottom: 20px;
    border-radius: 10px;
    border: none;
    background: #0d60e5;
    color: white;
}

input:focus {
    outline: none;
    box-shadow: 0 0 0 3px rgba(99,102,241,0.5);
}

button {
    width: 100%;
    padding: 14px;
    border-radius: 30px;
    background: linear-gradient(135deg, #6366f1, #4338ca);
    color: white;
    border: none;
    font-weight: 600;
    box-shadow: 0 12px 30px rgba(99,102,241,0.5);
    margin-bottom: 20px;   /* 🔹 GAP BELOW MAIN BUTTON */

}
/* Cancel button */
.btn-cancel {
    display: block;              /* 🔹 allows centering */
    width: fit-content;          /* 🔹 button size fits content */
    margin: 0 auto;              /* 🔹 CENTER THE BUTTON */
    padding: 14px 36px;
    font-size: 16px;
    border-radius: 32px;
    background: linear-gradient(135deg, #9ca3af, #6b7280);
    color: white;
    font-weight: 600;
    box-shadow: 0 8px 18px rgba(0,0,0,0.25);

}

/* Hover effect */
.btn-cancel:hover {
    background: linear-gradient(135deg, #6b7280, #4b5563);
    transform: translateY(-2px);
}


</style>

</head>
<body>
    <h1>Edit Student</h1>

    <form method="POST">
        <div class="info">Editing Student ID: {{ student['id'] }}</div>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="{{ student['name'] }}" required>
        <!-- value="{{ student['name'] }}" pre-fills the form with current data -->

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" value="{{ student['email'] }}" required>

        <label for="course">Course:</label>
        <input type="text" id="course" name="course" value="{{ student['course'] }}" required>

        <button type="submit" class="btn btn-submit">Update Student</button>
       <a href="{{ url_for('index') }}" class="btn btn-submit btn-cancel">Cancel</a>    </form>

    <hr>
    <p><strong>Note:</strong> The form is pre-filled with current values using value="{% raw %}{{ student['field'] }}{% endraw %}" attribute</p>
</body>
</html>
